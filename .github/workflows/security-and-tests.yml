name: Security scan and tests

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow's GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

# Third-party actions are pinned to full commit SHAs (tags can be moved;
# SHAs cannot), with the human-readable version in a comment.

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  python-security:
    name: SAST (bandit) + dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: Bandit SAST scan
        run: bandit -r triage-service/ security/ it-assistant-portal/ -x triage-service/tests,triage-service/venv,security/tests,it-assistant-portal/tests -ll
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r triage-service/requirements.txt
          pip-audit -r it-assistant-portal/requirements.txt

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r triage-service/requirements.txt
          pip install pytest
      - name: Run triage service tests
        run: |
          cd triage-service
          PYTHONPATH=. python -m pytest tests/ -v
      - name: Run active-response tests
        run: python -m pytest security/tests/ -v

  portal-tests:
    name: Portal security regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r it-assistant-portal/requirements.txt
          pip install httpx==0.28.1 pytest
      - name: Run tests
        run: python -m pytest it-assistant-portal/tests/ -v

  container-security:
    name: Container build + Trivy scan + SBOM
    runs-on: ubuntu-24.04
    needs: unit-tests
    env:
      # Trivy runs from its official image, pinned to an exact version
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Dockerfile for misconfigurations
        run: >
          docker run --rm
          -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" config --exit-code 1 --severity HIGH,CRITICAL
          /src/triage-service

      - name: Build image
        run: docker build -t triage-service:ci triage-service/

      - name: Scan image for vulnerabilities (fail on fixable HIGH/CRITICAL)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL triage-service:ci

      - name: Generate SBOM (CycloneDX)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          -v "$PWD:/out"
          "$TRIVY_IMAGE" image --format cyclonedx
          --output /out/sbom.cdx.json triage-service:ci

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-service-sbom
          path: sbom.cdx.json

  policy-as-code:
    name: Policy as code (OPA / Conftest)
    runs-on: ubuntu-24.04
    env:
      CONFTEST: docker run --rm -v ${{ github.workspace }}:/project -w /project openpolicyagent/conftest:v0.70.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Policy unit tests
        run: |
          $CONFTEST verify --policy policy/dockerfile
          $CONFTEST verify --policy policy/compose

      - name: Enforce policy on the real Dockerfile and compose file
        run: |
          $CONFTEST test --parser dockerfile --policy policy/dockerfile --namespace dockerfile triage-service/Dockerfile
          $CONFTEST test --policy policy/compose --namespace compose deploy/docker-compose.yml

      - name: "Tamper test: insecure files must be REJECTED"
        run: |
          if $CONFTEST test --parser dockerfile --policy policy/dockerfile --namespace dockerfile policy/fixtures/insecure.Dockerfile; then
            echo "::error::Policy accepted an insecure Dockerfile"; exit 1
          fi
          if $CONFTEST test --policy policy/compose --namespace compose policy/fixtures/insecure-compose.yml; then
            echo "::error::Policy accepted an insecure compose file"; exit 1
          fi
          echo "Insecure fixtures were correctly rejected"

  publish-sign-attest:
    name: Publish, sign, and attest image (Cosign + SLSA provenance)
    # Only reviewed code on main is published, and only after every gate passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets-scan, python-security, unit-tests, portal-tests, container-security, policy-as-code]
    runs-on: ubuntu-24.04
    # Extra permissions granted to this job only
    permissions:
      contents: read
      packages: write      # push to GitHub Container Registry
      id-token: write      # keyless signing identity (GitHub OIDC)
      attestations: write  # build provenance
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      SIGNER: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (immutable commit tag, referenced by digest)
        id: push
        run: |
          NAME="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/triage-service"
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$NAME:$GITHUB_SHA" triage-service/
          docker push "$NAME:$GITHUB_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$NAME:$GITHUB_SHA" | cut -d@ -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image (keyless, bound to this workflow's identity)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Attach SBOM as a signed attestation
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json \
            "${{ steps.push.outputs.name }}:$GITHUB_SHA"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.ref }}"

      - name: Generate build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature, SBOM attestation, and provenance
        run: |
          REF="${{ steps.push.outputs.ref }}"
          cosign verify "$REF" --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          # Provenance verified with cosign as well (one tool, one trust root)
          cosign verify-attestation "$REF" --type slsaprovenance1 \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "Signature, SBOM attestation, and provenance verified"

      - name: "Tamper tests: untrusted images must be REJECTED"
        run: |
          REF="${{ steps.push.outputs.ref }}"
          NAME="${{ steps.push.outputs.name }}"

          # 1. Signed image, but claimed signer is someone else -> must fail
          if cosign verify "$REF" --certificate-oidc-issuer "$OIDC_ISSUER" \
               --certificate-identity "https://github.com/attacker/repo/.github/workflows/x.yml@refs/heads/main" > /dev/null 2>&1; then
            echo "::error::Verification accepted the wrong signer identity"; exit 1
          fi

          # 2. Modified image (different digest, never signed) -> must fail
          printf 'FROM %s\nLABEL tampered="true"\n' "$REF" | docker build -t "$NAME:tamper-test" -
          docker push "$NAME:tamper-test"
          TAMPERED=$(docker inspect --format='{{index .RepoDigests 0}}' "$NAME:tamper-test")
          if cosign verify "$TAMPERED" --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null 2>&1; then
            echo "::error::Verification accepted a tampered, unsigned image"; exit 1
          fi
          echo "Wrong-signer and tampered-image checks correctly rejected"
