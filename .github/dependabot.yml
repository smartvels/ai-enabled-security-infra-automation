# Dependabot: weekly update PRs for every dependency type in the repo.
# The cooldown waits 14 days after a release before proposing it, so brand-new
# (possibly compromised) versions are not pulled in immediately. Every update
# PR still has to pass the full CI security pipeline before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /triage-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      triage-python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /it-assistant-portal
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      portal-python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /triage-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
